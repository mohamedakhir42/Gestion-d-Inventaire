version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_web_prod
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env.prod
    restart: always

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_celery_worker_prod
    command: celery -A config worker -l info --concurrency=4
    env_file:
      - .env.prod
    restart: always

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_celery_beat_prod
    command: celery -A config beat -l info
    env_file:
      - .env.prod
    restart: always

volumes:
  static_volume:
  media_volume:
