# Docker Compose for local development
version: '3.8'

services:
  web:
    build: .
    command: bash -lc "./compose/local/django-entrypoint.sh"
    volumes:
      - ./:/app
    ports:
      - 8000:8000
    env_file:
      - ./.env
    depends_on:
      - db
      - redis
      - minio

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - 6379:6379

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
