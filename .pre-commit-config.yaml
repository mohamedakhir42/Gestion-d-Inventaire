repos:
-   repo: https://github.com/psf/black
    rev: 24.1.0
    hooks:
    -   id: black
        language_version: python3.10

-   repo: https://github.com/pycqa/ruff
    rev: v0.0.284
    hooks:
    - id: ruff

-   repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
    - id: isort

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.5
    hooks:
    - id: mypy
      entry: mypy
      language: system
